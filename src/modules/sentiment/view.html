<main class="module-body">
 <header class="module-header"><div class="module-heading"><h1>情绪周期</h1><small>市场情绪与涨跌分布</small><button id="refresh" type="button">刷新</button></div><div class="module-controls"><div class="segmented" aria-label="情绪走势周期"><button id="mode-today" type="button">分时</button><button id="mode-five" type="button">五日</button></div><input id="date" type="date" aria-label="情绪查询日期" min="2024-03-28"><button id="today" type="button">返回今日</button></div></header>
 <div id="data-state" class="data-state module-meta" role="status">正在获取情绪数据…</div><div id="notice" class="notice" hidden></div>
 <div class="sentiment-workspace"><section class="panel sentiment-chart-panel"><div class="section-title"><h2 id="chart-title">情绪分时</h2><span id="chart-period" class="muted tiny"></span></div><div class="sentiment-metrics"><div><span id="current-label">最新情绪</span><strong id="current">—</strong></div><div><span id="delta-label">较前日收盘</span><strong id="delta">—</strong></div><div><span>区间最高</span><strong id="highest">—</strong></div><div><span>区间最低</span><strong id="lowest">—</strong></div></div><div class="chart-legend" id="legend"></div><div class="chart-wrap" id="chart-wrap"><svg id="chart" class="chart" tabindex="0" role="img" aria-label="情绪分时曲线" aria-describedby="chart-help"></svg><div class="chart-tooltip" id="tooltip" hidden></div></div><div class="chart-help" id="chart-help">鼠标悬停／手机按住拖动查看数值；键盘左右键逐分钟查看。</div><div class="recent-days" id="recent-days" aria-label="最近交易日"></div></section>
 <aside class="panel breadth"><div class="section-title"><h2>涨跌分布</h2><span id="breadth-date" class="muted tiny">—</span></div><p class="muted tiny" id="breadth-note">对应所选截止交易日的统计</p><div class="breadth-share positive" id="up-share">—</div><div class="muted tiny">上涨占涨跌家数比例</div><div class="breadth-bar" aria-hidden="true"><span id="bar-up"></span></div><div class="breadth-counts" id="counts"></div><p class="muted tiny" id="breadth-status"></p></aside></div>
 <section class="panel daily-panel"><div class="section-title"><h2>每日概览</h2><span class="muted tiny">点击交易日查看分时</span></div><div class="day-grid" id="day-grid"></div></section>
 <details class="source-details"><summary>数据来源与下载</summary><div><span id="source-info"></span><button id="download-chart" type="button" disabled>下载走势 JSON</button><button id="download-mood" type="button" disabled>下载涨跌 JSON</button></div></details>
</main>
